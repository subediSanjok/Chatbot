<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>g4f Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }
    h2 { margin-bottom: 16px; color: #60a5fa; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #94a3b8; }
    input, select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 10px;
    }
    button:hover { background: #2563eb; }
    .status { margin-top: 12px; font-size: 13px; color: #4ade80; }
  </style>
</head>
<body>
  <h2>⚙️ g4f Extension Settings</h2>

  <div class="form-group">
    <label for="serverUrl">g4f Server API Base URL:</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:1337">
    <small style="color:#64748b; font-size:11px;">Default is http://127.0.0.1:1337 (or whichever port you specify with --port)</small>
  </div>

  <div class="form-group">
    <label for="defaultModel">Default Model:</label>
    <select id="defaultModel">
      <option value="gpt-4o">gpt-4o</option>
      <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      <option value="deepseek-r1">deepseek-r1</option>
      <option value="claude-3.5-sonnet">claude-3.5-sonnet</option>
      <option value="llama-3.3-70b">llama-3.3-70b</option>
    </select>
  </div>

  <button id="saveBtn">Save Settings</button>
  <div class="status" id="statusMsg"></div>

  <script src="options.js"></script>
</body>
</html>
